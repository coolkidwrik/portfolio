<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/whiskey.ico">
    <title>Wrik Steven Sen | Software Engineer</title>

    <!--
      Search and link-preview tags. These must live here in index.html (not be added
      by React): LinkedIn, Slack and most link previewers don't run JavaScript, so
      they only see what's in this file. Image and URLs must be absolute.
    -->
    <meta name="description" content="Software engineer and UBC Computer Science student building full-stack web apps with React, Next.js and TypeScript, plus interactive 3D graphics with Three.js." />
    <meta name="author" content="Wrik Steven Sen" />
    <meta name="theme-color" content="#000726" />
    <link rel="canonical" href="https://ckwrik.vercel.app/" />

    <!-- Open Graph: LinkedIn, Facebook, Slack, Discord, iMessage -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Wrik Steven Sen" />
    <meta property="og:title" content="Wrik Steven Sen | Software Engineer" />
    <meta property="og:description" content="Full-stack web apps and 3D graphics with React, Next.js, TypeScript and Three.js. See my projects, experience and résumé." />
    <meta property="og:url" content="https://ckwrik.vercel.app/" />
    <meta property="og:image" content="https://ckwrik.vercel.app/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Wrik Steven Sen, Software Engineer: full-stack web apps and 3D graphics, with screenshots of a 3D globe travel blog and a shader demo." />

    <!-- X / Twitter (falls back to Open Graph for anything not set here) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Wrik Steven Sen | Software Engineer" />
    <meta name="twitter:description" content="Full-stack web apps and 3D graphics with React, Next.js, TypeScript and Three.js." />
    <meta name="twitter:image" content="https://ckwrik.vercel.app/og-image.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
